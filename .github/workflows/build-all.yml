name: Build all platforms

# One workflow, every platform:
#   Android + Chromebook : Music-android.apk   (one APK for phones and for Chromebooks - phones use arm64, x86_64
#                                               Chromebooks use x64; install it from the Play-less "Files" app)
#   iPhone / iPad        : Aurora-widget.ipa, Aurora-no-widget.ipa  (unsigned: install with AltStore / SideStore)
#   macOS                : Music-macos.zip     (unsigned .app: right-click -> Open the first time)
#   Windows              : Music-windows.zip   (unzip and run music.exe / aurora_music.exe)
#   Linux / Chromebook   : Music-linux.tar.gz  (for ChromeOS "Linux development environment" and other Linux)
#
# Run it from the Actions tab ("Run workflow"). Tick "Publish a GitHub release" to also get a Releases page with
# every file attached (push a tag like v1.0.0 to do the same automatically).

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release with all files
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  android:
    name: Android + Chromebook (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Generate platform folders
        run: python3 tool_setup.py
      - run: flutter pub get
      - name: Build APK (arm, arm64 and x86_64 for Chromebooks)
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64
      - run: cp build/app/outputs/flutter-apk/app-release.apk Music-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Music-android
          path: Music-android.apk
          if-no-files-found: error

  ios:
    name: iPhone / iPad (unsigned IPA)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Generate platform folders
        run: python3 tool_setup.py
      - run: flutter pub get
      - name: Add Siri (App Intents)
        continue-on-error: true
        run: ruby tool_setup_ios_intents.rb
      - name: Build without widget
        run: |
          flutter build ios --release --no-codesign
          rm -rf Payload && mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Aurora-no-widget.ipa Payload
          rm -rf Payload
      - name: Add the iOS widget
        id: widget
        continue-on-error: true
        run: |
          ruby tool_setup_ios_widget.rb
          cd ios && pod install && cd ..
          flutter build ios --release --no-codesign
          test -d build/ios/iphoneos/Runner.app/PlugIns/AuroraWidget.appex
          brew install ldid
          ldid -S"ios/Runner/Runner.entitlements" build/ios/iphoneos/Runner.app/Runner
          ldid -S"ios/AuroraWidget/AuroraWidget.entitlements" build/ios/iphoneos/Runner.app/PlugIns/AuroraWidget.appex/AuroraWidget
          rm -rf Payload && mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Aurora-widget.ipa Payload
      - name: Widget build note
        if: ${{ steps.widget.outcome == 'failure' }}
        run: echo "::warning::The widget build failed; only Aurora-no-widget.ipa was produced."
      - uses: actions/upload-artifact@v4
        with:
          name: Music-ios
          path: |
            Aurora-no-widget.ipa
            Aurora-widget.ipa
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Generate platform folders
        run: python3 tool_setup.py
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip the app
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -n 1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" Music-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Music-macos
          path: Music-macos.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Generate platform folders
        shell: pwsh
        run: python tool_setup.py
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Music-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Music-windows
          path: Music-windows.zip
          if-no-files-found: error

  linux:
    name: Linux / Chromebook (Linux environment)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev mpv libasound2-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Generate platform folders
        run: python3 tool_setup.py
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Pack the bundle
        run: tar -C build/linux/x64/release/bundle -czf Music-linux.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: Music-linux
          path: Music-linux.tar.gz
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [android, ios, macos, windows, linux]
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || inputs.release == true) && needs.android.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -lR dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Music ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', github.run_number) }}
          files: dist/*
          fail_on_unmatched_files: false
